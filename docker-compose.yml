version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: target-management-system:latest
    container_name: target-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=target_system
      - DB_USERNAME=target_user
      - DB_PASSWORD=secure_password
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    networks:
      - target-network
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: target-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/ssl:/etc/nginx/ssl
    networks:
      - target-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: target-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: target_system
      MYSQL_USER: target_user
      MYSQL_PASSWORD: secure_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - "3306:3306"
    networks:
      - target-network

  redis:
    image: redis:7-alpine
    container_name: target-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - target-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: target-worker
    restart: unless-stopped
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - REDIS_HOST=redis
    volumes:
      - .:/var/www/html
    networks:
      - target-network
    depends_on:
      - db
      - redis

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: target-scheduler
    restart: unless-stopped
    command: /bin/sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - REDIS_HOST=redis
    volumes:
      - .:/var/www/html
    networks:
      - target-network
    depends_on:
      - db
      - redis

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  target-network:
    driver: bridge
